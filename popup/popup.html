<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cowl</title>
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="w-80 bg-gray-900 text-gray-100 p-4 font-sans antialiased">
  <div id="app">
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <img src="../assets/logo.png" alt="" class="w-4 h-4 rounded">
        <h1 class="text-lg font-bold text-indigo-400">Cowl</h1>
      </div>
      <span class="text-xs text-gray-500">Privacy Blur</span>
    </header>

    <div class="space-y-3">
      <label class="flex items-center justify-between py-2 px-3 bg-gray-800 rounded-lg cursor-pointer">
        <span class="text-sm font-medium">Blur Active</span>
        <input type="checkbox" id="toggleBlur" class="toggle-checkbox">
      </label>

      <button id="btnLock" class="w-full py-2 px-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors">
        Lock Now
      </button>

      <button id="btnOptions" class="w-full py-2 px-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm font-medium transition-colors">
        Open Settings
      </button>
    </div>

    <footer class="mt-4 pt-3 border-t border-gray-800 text-center">
      <span id="lockStatus" class="text-xs text-gray-500"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
